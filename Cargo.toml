[workspace]
resolver = "3"
members = [
    "crates/lang0",
    "crates/lang0-wasm",
]
exclude = ["crates/lang0-wasm/guest"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# 三个仓库并排放：croon、（本仓库）、croon-app。跨仓依赖只在这里写一次路径。
croon-eval = { path = "../croon/crates/eval" }
croon-port = { path = "../croon/crates/port" }
croon-tree = { path = "../croon/crates/tree" }
kernel = { path = "../croon/crates/kernel" }
serde_json = { version = "1", default-features = false, features = ["std", "float_roundtrip"] }
ruff_python_parser = { version = "=0.0.21", default-features = false }
ruff_python_ast = { version = "=0.0.21", default-features = false }
ruff_text_size = { version = "=0.0.21", default-features = false }
num-bigint = { version = "=0.4.8", default-features = false, features = ["std"] }
num-integer = { version = "=0.1.47", default-features = false, features = ["std"] }
num-traits = { version = "=0.2.19", default-features = false, features = ["std"] }
wasmtime = { version = "=38.0.4", default-features = false, features = ["std", "runtime", "cranelift"] }

[profile.release]
overflow-checks = true
